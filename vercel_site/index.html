<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BvAi</title>
<style>
  html, body { margin:0; height:100%; background:#fff; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }
  #wait { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
          color:#2F6F5E; font-size:18px; gap:8px; z-index:0; }
  #wait b { font-size:34px; }
  #wait small { color:#868e96; font-size:14px; }
  #open { position:fixed; right:14px; bottom:12px; z-index:5; font-size:12px; color:#495057; background:#ffffffd9;
          border:1px solid #ced4da; border-radius:8px; padding:5px 10px; text-decoration:none; }
  #setup { max-width:560px; margin:12vh auto; padding:0 20px; line-height:1.7; color:#1f2328; }
  #setup h1 { color:#2F6F5E; } #setup code { background:#f1f3f5; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<script>
  // Streamlit Community Cloud에 올린 BvAi 주소를 여기에 넣으세요. 예: https://bvai.streamlit.app
  const STREAMLIT_URL = "";
</script>
<script>
  if (!STREAMLIT_URL) {
    document.body.innerHTML = '<div id="setup"><h1>BvAi</h1><p>아직 앱 주소가 연결되지 않았어요.</p>' +
      '<p><code>index.html</code> 맨 위의 <code>STREAMLIT_URL</code>에 Streamlit 앱 주소를 넣고 다시 배포하세요.</p></div>';
  } else {
    const url = STREAMLIT_URL.replace(/\/+$/, "");
    document.body.innerHTML =
      '<div id="wait"><b>BvAi</b>불러오는 중이에요…<small>처음 열 때는 20초 정도 걸릴 수 있어요</small></div>' +
      '<iframe src="' + url + '/?embed=true" title="BvAi" allow="clipboard-write"></iframe>' +
      '<a id="open" href="' + url + '" target="_blank" rel="noopener">새 창에서 열기</a>';
  }
</script>
</body>
</html>
